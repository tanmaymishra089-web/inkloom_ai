# Requires an authenticated Render account, GitHub repository and paid plans.
# Review costs in Render before applying. This file is not proof of deployment.
services:
  - type: web
    name: inkloom-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inkloom-db
          property: connectionString
      - key: DEMO_ENABLED
        value: "true"
      - key: DEMO_COOKIE_SECURE
        value: "true"
      - key: EXPOSE_API_DOCS
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: LLM_MAX_CALLS
        value: "6"
databases:
  - name: inkloom-db
    plan: basic-256mb
    postgresMajorVersion: "16"
